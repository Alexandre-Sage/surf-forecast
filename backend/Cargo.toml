[package]
name = "forecast_api"
version = "0.1.0"
edition = "2021"

[[bin]]
name="forecast_api"
path="src/bin/main.rs"

[lib]
name="forecast_api"
path="src/lib/lib.rs"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.7", features = ["macros", "tokio", "json"] }
chrono = { version = "0.4.42", features = ["serde"] }
env_logger = "0.10"
futures = "0.3.31"
log = "0.4.29"
redis = {version = "1.0.0", features = ["tokio-comp","aio"]}
reqwest = { version = "0.12.24", features = ["json","cookies","brotli"] }
serde ={ version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6" ,features = ["chrono", "sqlite", "runtime-tokio"] }
thiserror = "2.0.17"
tokio = { version = "1.47.2",features = ["net","macros","rt-multi-thread"] }
typed-headers = "0.2.0"
url = { version = "2.5.7", features = [] }
uuid = "1.19.0"
envy = "0.4.2"
dotenvy = "0.15.7"
headless_chrome = "0.9"
tower ={version = "0.5.2",features = []}
tower-http ={version = "0.6.8",features = ["cors"]}
strum ={version = "0.27.2", features = ["derive"]}
